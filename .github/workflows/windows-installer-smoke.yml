name: Windows installer lifecycle smoke

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'perf/**'
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  windows-installer-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mobile archive bridge Windows SQLite regression
        run: python -m unittest discover -s native -p test_mobile_archive_bridge.py -v
      - name: Mixed archive ZIP Windows regression
        run: python -m unittest discover -s native -p test_archive_package_adapter.py -v
      - name: Live local UYAP Archive AI regression
        run: python -m unittest discover -s native -p test_live_archive_adapter.py -v
      - name: Real archive readiness and artifact exclusions (synthetic)
        run: python -m unittest discover -s native -p test_archive_readiness.py -v
      - name: Archive DB schema diagnostic (synthetic)
        run: python -m unittest discover -s native -p test_diagnose_archive.py -v
      - name: Privacy-safe unsupported file type breakdown (synthetic)
        run: python -m unittest discover -s native -p test_audit_archive_formats.py -v
      - name: Local ZIP central directory safety audit (synthetic)
        run: python -m unittest discover -s native -p test_audit_archive_zip.py -v
      - name: Ephemeral device pairing and revoke tests
        run: python -m unittest discover -s native -p test_mobile_pairing.py -v
      - name: S2-04 large archive pagination regression
        run: python native/s2_04_paged_archive_regression_test.py
      - name: S2-05 read-only archive snapshot cache regression
        run: python native/s2_05_archive_snapshot_cache_regression_test.py
      - name: S2-06 registry scan without per-row resolve
        run: python native/s2_06_registry_fast_scan_regression_test.py
      - name: Legacy loose evrak_<id> adoption on Windows (fsync on a writable handle)
        run: python native/rc15_9_27_source_id_loose_import_regression_test.py
      - name: Release identity
        run: python native/current_release_identity_test.py
      - name: Clean-install host contract
        run: python native/rc15_4_clean_install_regression_test.py
      - name: Agent lifecycle and rollback contract
        run: python native/rc15_5_agent_lifecycle_regression_test.py
      - name: Portable installer contract
        run: python native/rc15_7_portable_installer_regression_test.py
      - name: Release channel packaging contract
        run: python native/phase1_release_channel_contract_test.py
      - name: IExpress directive invocation contract
        run: python native/offline_setup_iexpress_regression_test.py
      - name: PowerShell installer syntax
        shell: powershell
        run: |
          $files = @(
            'native/build_offline_setup.ps1',
            'native/portable_installer.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax failed: $file"
            }
          }
